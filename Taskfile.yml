version: '3'

dotenv: ['.env']
vars:
  TEST_FLAGS: "-v -race -parallel 5 -shuffle=on"
  COVER_FLAGS: "-coverprofile=./cover.out -covermode=atomic -coverpkg=./..."

tasks:
  docker:
    desc: "Rebuild and restart docker containers"
    cmds:
      - task: clean-docker
      - docker compose up -d --build

  clean-docker:
    desc: "Clean docker containers and images"
    cmds:
      - docker compose down
      - docker image prune -f

  mock:
    desc: "Generate mocks using mockery with config"
    cmds:
      - mockery

  test:
    desc: "Run tests with race detection and coverage"
    cmds:
      - go test {{.TEST_FLAGS}} {{.COVER_FLAGS}} ./...

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  deps:
    desc: "Download dependencies"
    cmds:
      - go mod download
      - go mod verify
      - go mod tidy

  build:
    desc: "Build application"
    cmds:
      - go build -o bin/app ./cmd/

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf bin/
      - rm -f cover.out

